spring:
  application:
    name: manager-reports
  datasource:
    url: jdbc:postgresql://localhost:5432/managementreport
    username: postgres
    driver-class-name: org.postgresql.Driver
    # Ajustes recomendados para HikariCP (pool de conexiones por defecto en Spring Boot):
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
